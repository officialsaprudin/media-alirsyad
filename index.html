<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniscient Media Kiosk</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        
        /* Layout Grid & Flexbox */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--surface-color); margin-bottom: 20px; gap: 15px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background-color: var(--primary-color); color: #000; }
        .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn:hover { opacity: 0.8; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .media-card { background: var(--surface-color); border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .card-thumb { width: 100%; height: 160px; background: #000; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: var(--primary-color); }
        .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        
        /* Slideshow Fullscreen */
        #slideshowContainer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; }
        #mediaCanvas { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        #mediaCanvas iframe, #mediaCanvas video, #mediaCanvas img { width: 100%; height: 100%; object-fit: contain; border: none; }
        
        #slideshowHUD { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); transition: opacity 0.5s; z-index: 10000; }
        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 5px; background: rgba(255,255,255,0.2); z-index: 10000; }
        .progress-bar { height: 100%; background: var(--primary-color); width: 0%; }
        
        /* Form View */
        #formView { display: none; max-width: 600px; margin: 0 auto; background: var(--surface-color); padding: 30px; border-radius: 12px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid #334155; color: white; border-radius: 8px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); }
        
        /* Utilities */
        .hidden { display: none !important; }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            header { flex-direction: column; align-items: stretch; }
            .header-actions { display: flex; flex-direction: column; gap: 10px; }
            .btn { justify-content: center; }
            .form-group-flex { flex-direction: column; gap: 15px; }
        }
        @media (min-width: 601px) {
            .form-group-flex { display: flex; gap: 20px; }
            .form-group-flex > div { flex: 1; }
        }
    </style>
</head>
<body>

    <script>
        const is_preview = false; // ARCHITECTURE SWITCH: TRUE = MOCK, FALSE = CLOUD
    </script>

    <!-- MAIN DASHBOARD -->
    <div id="mainView" class="container">
        <header>
            <div>
                <h1>Omniscient Media</h1>
                <p id="astralSyncStatus" style="color: var(--primary-color); font-size: 0.85rem;">Menyinkronkan Kordinat Astral (2113)...</p>
            </div>
            <div class="header-actions" style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="App.toggleView('form')"><i class="ph ph-plus-circle"></i> Injeksi Media</button>
                <button class="btn btn-primary" onclick="App.startKiosk()"><i class="ph ph-play-circle"></i> Play Preview</button>
            </div>
        </header>
        <div id="gallery" class="gallery-grid"></div>
    </div>

    <!-- FORM INJECTION -->
    <div id="formView" class="container hidden">
        <h2 id="formTitle">Injeksi Media Baru</h2>
        <input type="hidden" id="editId" value="">
        <div class="form-group" style="margin-top: 20px;">
            <label>Judul Entitas</label>
            <input type="text" id="inputTitle" placeholder="Nama entitas...">
        </div>
        <div class="form-group">
            <label>Tipe Media</label>
            <select id="inputType">
                <option value="image">Gambar (URL)</option>
                <option value="youtube">YouTube (URL/ID)</option>
                <option value="video">Video (Lokal/URL Langsung)</option>
                <option value="iframe">Website / Drive Iframe (URL)</option>
            </select>
        </div>
        <div class="form-group">
            <label>URL / Sumber</label>
            <input type="text" id="inputSource" placeholder="https://...">
        </div>
        <div class="form-group form-group-flex">
            <div>
                <label>Durasi Transisi (Detik)</label>
                <input type="number" id="inputDuration" value="15">
            </div>
            <div style="display: flex; align-items: center; padding-top: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #f8fafc; font-size: 1rem;">
                    <input type="checkbox" id="inputMute" style="width: auto;"> Bisukan Audio (Mute)
                </label>
            </div>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 10px; padding: 15px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; margin-bottom: 25px; border: 1px solid rgba(16, 185, 129, 0.3);">
            <input type="checkbox" id="inputPrayer" style="width: auto;">
            <label style="margin:0; color: #10b981; font-weight: bold; cursor: pointer;">Jadikan Media Khusus Waktu Sholat (H-15)</label>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="App.saveMedia()" style="flex: 2; justify-content: center;" id="btnSubmit">Suntikkan ke Database</button>
            <button class="btn btn-danger" onclick="App.toggleView('main')" style="flex: 1; justify-content: center;">Batal</button>
        </div>
    </div>

    <!-- KIOSK SLIDESHOW VIEW -->
    <div id="slideshowContainer">
        <div id="slideshowHUD">
            <h2 id="hudTitle">Title</h2>
            <div style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">ESC / 3x Spacebar to Exit</div>
        </div>
        <div id="mediaCanvas"></div>
        <div class="progress-container">
            <div id="slideProgress" class="progress-bar"></div>
        </div>
    </div>

    <!-- FIREBASE SDK V9 CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8XREeEtq3K0c7melRj1Y2xgRvlhEMAjk",
            authDomain: "gen-lang-client-0756249566.firebaseapp.com",
            projectId: "gen-lang-client-0756249566",
            storageBucket: "gen-lang-client-0756249566.firebasestorage.app",
            messagingSenderId: "883275008498",
            appId: "1:883275008498:web:76b77d6020c29e0c02436b",
            measurementId: "G-VT430BGSL8"
        };

        let db, auth;
        if (!is_preview) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            signInAnonymously(auth).catch(err => console.error("Otorisasi Gagal:", err));
        }

        window.App = {
            mediaData: [],
            currentIndex: 0,
            slideTimer: null,
            hudTimer: null,
            prayerMode: false,
            dbRef: null,

            init() {
                // Restore State
                const savedView = localStorage.getItem('omni_currentView') || 'main';
                if(savedView === 'form') this.toggleView('form', true);

                if (is_preview) {
                    this.mediaData = [
                        { id: 'mock1', title: "Nexus Intro", type: "image", source: "https://picsum.photos/1920/1080", duration: 5, mute: false, isPrayer: false, order: 1 }
                    ];
                    this.renderGallery();
                } else {
                    this.dbRef = collection(db, "media");
                    const q = query(this.dbRef, orderBy("timestamp", "asc"));
                    onSnapshot(q, (snapshot) => {
                        this.mediaData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        this.renderGallery();
                    });
                }
                
                this.checkPrayerTime();
                setInterval(() => this.checkPrayerTime(), 60000); 

                // Kiosk Escape Mechanism
                let spacePresses = 0;
                let spaceTimer;
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        spacePresses++;
                        clearTimeout(spaceTimer);
                        if (spacePresses >= 3) { this.stopKiosk(); spacePresses = 0; }
                        spaceTimer = setTimeout(() => spacePresses = 0, 1000);
                    }
                    if (e.code === 'Escape') this.stopKiosk();
                });

                // HUD Auto-hide
                const hud = document.getElementById('slideshowHUD');
                const resetHud = () => {
                    hud.style.opacity = '1';
                    document.body.style.cursor = 'default';
                    clearTimeout(this.hudTimer);
                    this.hudTimer = setTimeout(() => {
                        hud.style.opacity = '0';
                        document.body.style.cursor = 'none';
                    }, 2500);
                };
                window.addEventListener('mousemove', resetHud);
                window.addEventListener('click', resetHud);
            },

            toggleView(view, skipSave = false) {
                if(!skipSave) localStorage.setItem('omni_currentView', view);
                
                document.getElementById('mainView').classList.add('hidden');
                document.getElementById('formView').classList.add('hidden');
                document.getElementById(view + 'View').classList.remove('hidden');

                if (view === 'main') {
                    this.resetForm();
                }
            },

            resetForm() {
                document.getElementById('editId').value = '';
                document.getElementById('inputTitle').value = '';
                document.getElementById('inputSource').value = '';
                document.getElementById('inputDuration').value = '15';
                document.getElementById('inputMute').checked = false;
                document.getElementById('inputPrayer').checked = false;
                document.getElementById('formTitle').innerText = 'Injeksi Media Baru';
                document.getElementById('btnSubmit').innerText = 'Suntikkan ke Database';
            },

            editMedia(id) {
                const item = this.mediaData.find(m => m.id === id);
                if(!item) return;

                document.getElementById('editId').value = item.id;
                document.getElementById('inputTitle').value = item.title;
                document.getElementById('inputType').value = item.type;
                document.getElementById('inputSource').value = item.source;
                document.getElementById('inputDuration').value = item.duration;
                document.getElementById('inputMute').checked = item.mute;
                document.getElementById('inputPrayer').checked = item.isPrayer;
                
                document.getElementById('formTitle').innerText = 'Modifikasi Entitas';
                document.getElementById('btnSubmit').innerText = 'Perbarui Database';
                this.toggleView('form');
            },

            renderGallery() {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = this.mediaData.map(item => `
                    <div class="media-card">
                        <div class="card-thumb">
                            ${item.type === 'image' ? `<i class="ph ph-image"></i>` : 
                              item.type === 'iframe' ? `<i class="ph ph-globe" style="color: cyan;"></i>` : 
                              `<i class="ph ph-video"></i>`}
                        </div>
                        <div class="card-info">
                            <div>
                                <h3 style="margin-bottom: 5px; font-size: 1.1rem; word-break: break-word;">${item.title}</h3>
                                <p style="color: var(--text-muted); font-size: 0.85rem;">
                                    ${item.duration}s | ${item.mute ? '<span style="color:#f97316">Muted</span>' : '<span style="color:#38bdf8">Audio</span>'} 
                                    ${item.isPrayer ? '<br><span style="color:#10b981; font-weight:bold; display:inline-block; margin-top:5px;">[SHOLAT OVERRIDE]</span>' : ''}
                                </p>
                            </div>
                            <div class="card-actions">
                                <button class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="App.editMedia('${item.id}')"><i class="ph ph-pencil-simple"></i></button>
                                <button class="btn btn-danger" onclick="App.deleteMedia('${item.id}')"><i class="ph ph-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            async saveMedia() {
                let source = document.getElementById('inputSource').value.trim();
                let type = document.getElementById('inputType').value;
                const editId = document.getElementById('editId').value;
                
                if(!source) { alert("Sumber absolut tidak boleh kosong."); return; }

                // Google Drive Smart Parser (Force Iframe)
                if(source.includes('drive.google.com/file/d/')) {
                    type = 'iframe';
                    source = source.replace(/\/view.*$/, '/preview');
                }

                const payload = {
                    title: document.getElementById('inputTitle').value || 'Entitas Tanpa Nama',
                    type: type,
                    source: source,
                    duration: parseInt(document.getElementById('inputDuration').value) || 15,
                    mute: document.getElementById('inputMute').checked,
                    isPrayer: document.getElementById('inputPrayer').checked
                };

                if (is_preview) {
                    if (editId) {
                        const idx = this.mediaData.findIndex(m => m.id === editId);
                        this.mediaData[idx] = { ...this.mediaData[idx], ...payload };
                    } else {
                        this.mediaData.push({ id: Date.now().toString(), timestamp: Date.now(), ...payload });
                    }
                    this.renderGallery();
                } else {
                    if (editId) {
                        await updateDoc(doc(db, "media", editId), payload);
                    } else {
                        payload.timestamp = serverTimestamp();
                        await addDoc(this.dbRef, payload);
                    }
                }
                
                this.toggleView('main');
            },

            async deleteMedia(id) {
                if(confirm("Hancurkan entitas ini dari eksistensi?")) {
                    if(is_preview) {
                        this.mediaData = this.mediaData.filter(m => m.id !== id);
                        this.renderGallery();
                    } else {
                        await deleteDoc(doc(db, "media", id));
                    }
                }
            },

            async checkPrayerTime() {
                try {
                    const date = new Date();
                    const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
                    const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/2113/${y}/${m}/${d}`);
                    const json = await res.json();
                    document.getElementById('astralSyncStatus').innerText = "Kordinat Astral (BANJARMASIN 2113) Sinkron.";
                    
                    // Logic Override Temporal H-15 (Simplified for architecture context)
                } catch(e) {
                    document.getElementById('astralSyncStatus').innerText = "Gagal menyinkronkan astral.";
                }
            },

            startKiosk() {
                if (this.mediaData.length === 0) return;
                document.getElementById('slideshowContainer').style.display = 'block';
                document.body.style.overflow = 'hidden';
                this.currentIndex = 0;
                this.playSlide();
            },

            stopKiosk() {
                document.getElementById('slideshowContainer').style.display = 'none';
                document.body.style.overflow = 'auto';
                clearTimeout(this.slideTimer);
                document.getElementById('mediaCanvas').innerHTML = '';
            },

            playSlide() {
                let playlist = this.prayerMode ? this.mediaData.filter(m => m.isPrayer) : this.mediaData.filter(m => !m.isPrayer);
                if (playlist.length === 0) playlist = this.mediaData; // Failsafe
                
                if (this.currentIndex >= playlist.length) this.currentIndex = 0;
                const media = playlist[this.currentIndex];
                
                document.getElementById('hudTitle').innerText = media.title;
                const canvas = document.getElementById('mediaCanvas');
                const pBar = document.getElementById('slideProgress');
                
                pBar.style.transition = 'none';
                pBar.style.width = '0%';
                
                let content = '';
                if (media.type === 'image') {
                    content = `<img src="${media.source}" alt="media">`;
                } else if (media.type === 'iframe') {
                    content = `<iframe src="${media.source}" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>`;
                } else if (media.type === 'youtube') {
                    let yId = media.source.split('v=')[1] || media.source.split('/').pop();
                    content = `<iframe src="https://www.youtube.com/embed/${yId}?autoplay=1&controls=0&loop=1&playlist=${yId}${media.mute ? '&mute=1' : ''}" allow="autoplay"></iframe>`;
                } else {
                    content = `<video src="${media.source}" autoplay loop ${media.mute ? 'muted' : ''}></video>`;
                }
                
                canvas.innerHTML = content;
                
                setTimeout(() => {
                    pBar.style.transition = `width ${media.duration}s linear`;
                    pBar.style.width = '100%';
                }, 50);

                this.slideTimer = setTimeout(() => {
                    this.currentIndex++;
                    this.playSlide();
                }, media.duration * 1000);
            }
        };

        window.onload = () => App.init();
    </script>
</body>
</html>
